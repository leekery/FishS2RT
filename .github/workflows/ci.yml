name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e . --no-deps
      - run: python -m unittest discover -s tests/python -p "test_*.py" -v
      - run: python scripts/check_publication.py
      - run: python -m build
      - name: Inspect source archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/*.tar.gz | Select-Object -First 1
          tar -xf $archive.FullName -C $env:RUNNER_TEMP
          $source = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter "fish_s2-*" | Select-Object -First 1
          if (-not (Test-Path "$($source.FullName)/native/audio.cpp/CMakeLists.txt")) { throw "native CMakeLists missing from sdist" }
          if (-not (Test-Path "$($source.FullName)/native/audio.cpp/scripts/build_windows.ps1")) { throw "native build script missing from sdist" }
          if (-not (Test-Path "$($source.FullName)/packaging/runtime/pyproject.toml")) { throw "runtime wheel project missing from sdist" }
          if (-not (Test-Path "$($source.FullName)/tests/python/test_sdk.py")) { throw "Python tests missing from sdist" }
          if (Test-Path "$($source.FullName)/native/audio.cpp/build") { throw "native build directory leaked into sdist" }
          $forbidden = Get-ChildItem $source.FullName -Recurse -File | Where-Object Extension -In ".gguf", ".safetensors", ".wav", ".mp3", ".flac", ".exe", ".dll", ".lib", ".pdb"
          if ($forbidden) { throw "binary, model, or media file leaked into sdist: $($forbidden[0].FullName)" }
      - name: Install SDK wheel outside checkout
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/fish_s2-*.whl | Select-Object -First 1
          python -m pip uninstall -y fish_s2
          python -m pip install $wheel.FullName
          Push-Location $env:RUNNER_TEMP
          python -c "import fish_s2; assert fish_s2.__version__ == '0.1.0'"
          Pop-Location

  native-configure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S native/audio.cpp -B build/native-configure -G "Visual Studio 17 2022" -A x64
          -DENGINE_ENABLE_CUDA=OFF
          -DENGINE_ENABLE_OPENMP=OFF
          -DAUDIOCPP_MODEL_SET=custom
          -DAUDIOCPP_MODELS=fish_audio
          -DAUDIOCPP_DEPLOYMENT_BUILD=ON
      - run: cmake --build build/native-configure --config Release --target audiocpp_cli --parallel 4
      - run: build/native-configure/bin/Release/audiocpp_cli.exe --build-info-json
